openapi: 3.1.0
info:
  title: Alice Voice Backend API
  description: REST and socket contract owned by the backend. Frontend copies DTOs from this file.
  license:
    name: ''
  version: 0.1.0
servers:
- url: http://127.0.0.1:8787
  description: Local daemon
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Reply of `GET /api/health` and `GET /health`.
      operationId: health_handler
      responses:
        '200':
          description: Health reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
  /api/v1/chat:
    post:
      tags:
      - chat
      summary: Reply of `POST /api/v1/chat`.
      description: |-
        The daemon handles the message while the request runs: it resolves the
        intent, runs its command, and answers. Every stage streams on the
        socket stream, so the interface shows the turn while it runs.

        The daemon stores the turn in a conversation when the queue is on. It
        answers without a store when the queue is off.
      operationId: chat_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestDto'
        required: true
      responses:
        '201':
          description: Handled turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReplyDto'
        '400':
          description: Invalid input
        '404':
          description: Conversation not found
        '413':
          description: Message too long
  /api/v1/conversations:
    get:
      tags:
      - conversations
      summary: Reply of `GET /api/v1/conversations`.
      operationId: list_conversations_handler
      parameters:
      - name: limit
        in: query
        description: Maximum items to return.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListDto'
  /api/v1/conversations/{id}:
    get:
      tags:
      - conversations
      summary: Reply of `GET /api/v1/conversations/{id}`.
      operationId: get_conversation_handler
      parameters:
      - name: id
        in: path
        description: Conversation id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailDto'
        '404':
          description: Conversation not found
  /api/v1/dependencies:
    get:
      tags:
      - system
      summary: Reply of `GET /api/v1/dependencies`.
      operationId: get_dependencies_handler
      responses:
        '200':
          description: State of the dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependenciesDto'
  /api/v1/events:
    get:
      tags:
      - events
      summary: Upgrade `GET /api/v1/events` to a WebSocket.
      operationId: events_handler
      responses:
        '101':
          description: Switching Protocols
  /api/v1/intents:
    get:
      tags:
      - intents
      summary: Reply of `GET /api/v1/intents`.
      operationId: list_intents_handler
      responses:
        '200':
          description: Intent list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentListDto'
    post:
      tags:
      - intents
      summary: Reply of `POST /api/v1/intents`.
      operationId: create_intent_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentWriteDto'
        required: true
      responses:
        '201':
          description: Created intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDto'
        '400':
          description: Invalid input
        '409':
          description: The name is already in use
  /api/v1/intents/examples:
    post:
      tags:
      - intents
      summary: Reply of `POST /api/v1/intents/examples`.
      description: |-
        The endpoint adds the example intents that this catalog does not hold
        yet and answers with the whole catalog, so the settings page shows the
        new intents without a second read.
      operationId: create_examples_handler
      responses:
        '200':
          description: The whole catalog after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentListDto'
  /api/v1/intents/script/preview:
    post:
      tags:
      - intents
      summary: Reply of `POST /api/v1/intents/script/preview`.
      description: |-
        The settings page runs the script of an entity here, so a user reads
        the values a script answers with before a turn reads them.
      operationId: preview_script_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptPreviewWriteDto'
        required: true
      responses:
        '200':
          description: The values the script answered with
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptPreviewDto'
  /api/v1/intents/{id}:
    put:
      tags:
      - intents
      summary: Reply of `PUT /api/v1/intents/{id}`.
      operationId: update_intent_handler
      parameters:
      - name: id
        in: path
        description: Intent id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentWriteDto'
        required: true
      responses:
        '200':
          description: Updated intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDto'
        '400':
          description: Invalid input
        '404':
          description: Intent not found
        '409':
          description: The name is already in use
    delete:
      tags:
      - intents
      summary: Reply of `DELETE /api/v1/intents/{id}`.
      operationId: delete_intent_handler
      parameters:
      - name: id
        in: path
        description: Intent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Intent not found
  /api/v1/librarian:
    get:
      tags:
      - librarian
      summary: Reply of `GET /api/v1/librarian`.
      operationId: get_librarian_handler
      responses:
        '200':
          description: State of the librarian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarianStatusDto'
  /api/v1/librarian/facts/{id}:
    delete:
      tags:
      - librarian
      summary: Reply of `DELETE /api/v1/librarian/facts/{id}`.
      description: |-
        The fact is retired rather than deleted: it keeps its place in the
        history and stops being true now. The reply carries the concept it
        belongs to, so the editor reads the new state without a second call.
      operationId: retire_fact_handler
      parameters:
      - name: id
        in: path
        description: Identifier of the fact
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The concept the fact belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryNodeDto'
        '404':
          description: The fact does not exist
  /api/v1/librarian/lint:
    get:
      tags:
      - librarian
      summary: Reply of `GET /api/v1/librarian/lint`.
      operationId: lint_librarian_handler
      responses:
        '200':
          description: The memory linter report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarianLintDto'
  /api/v1/librarian/memories:
    get:
      tags:
      - librarian
      summary: Reply of `GET /api/v1/librarian/memories`.
      operationId: list_memories_handler
      parameters:
      - name: text
        in: query
        description: Words to search the memory for
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Largest number of nodes to return
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Memory nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryQueryDto'
    post:
      tags:
      - librarian
      summary: Reply of `POST /api/v1/librarian/memories`.
      operationId: write_memory_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryWriteRequestDto'
        required: true
      responses:
        '200':
          description: The stored node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryNodeDto'
        '400':
          description: Invalid input
  /api/v1/librarian/memories/{id}:
    delete:
      tags:
      - librarian
      summary: Reply of `DELETE /api/v1/librarian/memories/{id}`.
      description: |-
        The whole concept goes, facts included. A reader who wants to keep the
        history retires the one fact instead.
      operationId: delete_memory_handler
      parameters:
      - name: id
        in: path
        description: Identifier of the concept
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The concept is deleted
        '404':
          description: The concept does not exist
  /api/v1/librarian/memories/{id}/merge:
    post:
      tags:
      - librarian
      summary: Reply of `POST /api/v1/librarian/memories/{id}/merge`.
      description: |-
        The concept in the path moves into the concept the body names, so a
        reader settles the two concepts the memory holds for one thing without
        deleting either of them by hand. The reply is the concept that
        absorbed the other, so the editor reads its new state without a second
        call.
      operationId: merge_memory_handler
      parameters:
      - name: id
        in: path
        description: Identifier of the concept that moves
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryMergeRequestDto'
        required: true
      responses:
        '200':
          description: The concept that absorbed the other
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryNodeDto'
        '400':
          description: The merge names one concept twice
        '404':
          description: One of the concepts does not exist
  /api/v1/librarian/query:
    post:
      tags:
      - librarian
      summary: Reply of `POST /api/v1/librarian/query`.
      operationId: query_memory_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryQueryRequestDto'
        required: true
      responses:
        '200':
          description: Memory nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryQueryDto'
  /api/v1/resolver:
    get:
      tags:
      - resolver
      summary: Reply of `GET /api/v1/resolver`.
      operationId: get_resolver_handler
      responses:
        '200':
          description: State of the resolver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverStatusDto'
  /api/v1/resolver/gliner/models/{id}:
    delete:
      tags:
      - resolver
      summary: Reply of `DELETE /api/v1/resolver/gliner/models/{id}`.
      operationId: delete_gliner_model_handler
      parameters:
      - name: id
        in: path
        description: 'Model id, example: gliner_small-v2.1'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: State of the resolver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverStatusDto'
        '404':
          description: The daemon knows no model with that identifier
  /api/v1/resolver/gliner/models/{id}/download:
    post:
      tags:
      - resolver
      summary: Reply of `POST /api/v1/resolver/gliner/models/{id}/download`.
      description: |-
        The download runs in the background, so the reply carries the state the
        settings page polls while it runs.
      operationId: download_gliner_model_handler
      parameters:
      - name: id
        in: path
        description: 'Model id, example: gliner_small-v2.1'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: State of the resolver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverStatusDto'
        '404':
          description: The daemon knows no model with that identifier
        '409':
          description: A download already runs
  /api/v1/resolver/local/models/{id}:
    delete:
      tags:
      - resolver
      summary: Reply of `DELETE /api/v1/resolver/local/models/{id}`.
      operationId: delete_local_model_handler
      parameters:
      - name: id
        in: path
        description: 'Model id, example: bge-small-en-v1.5'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: State of the resolver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverStatusDto'
        '404':
          description: The daemon knows no model with that identifier
  /api/v1/resolver/local/models/{id}/download:
    post:
      tags:
      - resolver
      summary: Reply of `POST /api/v1/resolver/local/models/{id}/download`.
      description: |-
        The download runs in the background, so the reply carries the state the
        settings page polls while it runs.
      operationId: download_local_model_handler
      parameters:
      - name: id
        in: path
        description: 'Model id, example: bge-small-en-v1.5'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: State of the resolver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverStatusDto'
        '404':
          description: The daemon knows no model with that identifier
        '409':
          description: A download already runs
  /api/v1/resolver/preview:
    post:
      tags:
      - resolver
      summary: Reply of `POST /api/v1/resolver/preview`.
      description: |-
        The preview reads one message with the stored settings and runs
        nothing, so the settings page can show the route of a sentence before
        the user sends it. The reply carries the metadata of a stored turn, so
        the route of a sentence and the route of a message the daemon really
        handled read the same way.
      operationId: preview_message_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolverPreviewRequestDto'
        required: true
      responses:
        '200':
          description: How the resolver would read the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverPreviewDto'
        '400':
          description: Invalid input
        '413':
          description: Message too long
  /api/v1/scripts/{id}:
    get:
      tags:
      - scripts
      summary: Reply of `GET /api/v1/scripts/{id}`.
      operationId: get_script_handler
      parameters:
      - name: id
        in: path
        description: Script id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The stored script
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptDto'
        '404':
          description: Script not found
  /api/v1/scripts/{id}/approve:
    post:
      tags:
      - scripts
      summary: Reply of `POST /api/v1/scripts/{id}/approve`.
      description: |-
        The daemon claims the pending script and, when the claim belongs to
        this call, runs it. A second approval of the same script reports the
        stored script and runs nothing.
      operationId: approve_script_handler
      parameters:
      - name: id
        in: path
        description: Script id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The stored script after the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptDto'
        '404':
          description: Script not found
  /api/v1/scripts/{id}/deny:
    post:
      tags:
      - scripts
      summary: Reply of `POST /api/v1/scripts/{id}/deny`.
      description: |-
        A denied script stays in the store with its decision, so the surface
        still reads it and the daemon never runs it.
      operationId: deny_script_handler
      parameters:
      - name: id
        in: path
        description: Script id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The stored script after the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptDto'
        '404':
          description: Script not found
  /api/v1/settings:
    get:
      tags:
      - settings
      summary: Reply of `GET /api/v1/settings`.
      operationId: get_settings_handler
      responses:
        '200':
          description: Stored settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsDto'
    put:
      tags:
      - settings
      summary: Reply of `PUT /api/v1/settings`.
      description: |-
        A field the caller does not send keeps its stored value, so a caller
        may change one setting without sending the others.
      operationId: put_settings_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateDto'
        required: true
      responses:
        '200':
          description: Stored settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsDto'
        '400':
          description: Invalid input
  /api/v1/status:
    get:
      tags:
      - system
      summary: Reply of `GET /api/v1/status`.
      operationId: status_handler
      responses:
        '200':
          description: Status reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
  /api/v1/system:
    get:
      tags:
      - system
      summary: Reply of `GET /api/v1/system`.
      operationId: get_system_handler
      responses:
        '200':
          description: System profile of the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemProfileDto'
  /api/v1/system/preset:
    post:
      tags:
      - system
      summary: Reply of `POST /api/v1/system/preset`.
      operationId: post_system_preset_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPresetRequestDto'
        required: true
      responses:
        '200':
          description: Router preset for the quality
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPresetDto'
        '400':
          description: Invalid input
  /health:
    get:
      tags:
      - system
      summary: Alias of `GET /api/health` at `GET /health`.
      operationId: health_alias_handler
      responses:
        '200':
          description: Health reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
components:
  schemas:
    ChatMessageDto:
      type: object
      description: One stored turn of a conversation.
      required:
      - id
      - role
      - text
      - createdAt
      properties:
        confidence:
          type:
          - number
          - 'null'
          format: float
          description: Resolver confidence between 0 and 1, or null.
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
          description: Conversation the message belongs to, or null when the queue is off.
        createdAt:
          type: string
          format: date-time
          description: Time the daemon stored the message, in ISO 8601.
        id:
          type: string
          format: uuid
          description: Stable message identifier.
        intentId:
          type:
          - string
          - 'null'
          description: Resolved intent identifier, or null when none.
        intentName:
          type:
          - string
          - 'null'
          description: Name of the resolved intent, or null when none.
        memory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MessageMemoryDto'
            description: |2-

              What the turn taught the long term memory, or null when the memory
              learned nothing from it. The memory reads a turn after the daemon
              answered it, so the field is filled when a reader reads the message
              back rather than when the turn is stored.
        meta:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MessageMetaDto'
            description: How the daemon read the turn, or null when it read nothing.
        role:
          $ref: '#/components/schemas/ChatRoleDto'
          description: Speaker.
        text:
          type: string
          description: Message text.
    ChatReplyDto:
      type: object
      description: Reply of `POST /api/v1/chat`.
      required:
      - stored
      - user
      - reply
      properties:
        conversation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConversationDto'
            description: The conversation of the turn, or null when the queue is off.
        reply:
          $ref: '#/components/schemas/ChatMessageDto'
          description: Daemon reply.
        stored:
          type: boolean
          description: True when the daemon stored the turn, false when the queue is off.
        user:
          $ref: '#/components/schemas/ChatMessageDto'
          description: Stored user message.
    ChatRequestDto:
      type: object
      description: Body of `POST /api/v1/chat`.
      required:
      - text
      properties:
        context:
          type:
          - boolean
          - 'null'
          description: |-
            Whether the daemon reads the earlier turns of the conversation as
            the context of this message. Null reads them.

            A message sent with this false is read on its own, so the router
            holds it against the catalog alone and a model answers without the
            turns before it. A follow-up whose meaning depends on the turn
            before it needs the context, so the default reads it.
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
          description: Conversation to append to. Null starts a new conversation.
        text:
          type: string
          description: Text the user typed.
    ChatRoleDto:
      type: string
      description: Speaker of one chat message.
      enum:
      - user
      - assistant
    ConversationDetailDto:
      type: object
      description: Reply of `GET /api/v1/conversations/{id}`.
      required:
      - conversation
      - messages
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationDto'
          description: The conversation.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageDto'
          description: The full message history, oldest first.
    ConversationDto:
      type: object
      description: One conversation of the daemon. The conversation owns its message history.
      required:
      - id
      - title
      - createdAt
      - updatedAt
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time the daemon created the conversation, in ISO 8601.
        id:
          type: string
          format: uuid
          description: Stable conversation identifier.
        title:
          type: string
          description: Title the daemon generated from the first message.
        updatedAt:
          type: string
          format: date-time
          description: Time the daemon stored the last message, in ISO 8601.
    ConversationListDto:
      type: object
      description: Reply of `GET /api/v1/conversations`.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationDto'
          description: Conversations, most recently updated first.
    ConversationQuery:
      type: object
      description: Query of `GET /api/v1/conversations`.
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Maximum items to return.
          minimum: 0
    DaemonStateDto:
      type: string
      description: Daemon state that mirrors the backend state machine.
      enum:
      - Idle
      - Listening
      - Transcribing
      - Resolving
      - Executing
      - Error
    DependenciesDto:
      type: object
      description: |-
        The state of the dependencies of the settings surface.

        The reply needs no database, so the settings page can tell a database
        that is down from a daemon that is down.
      required:
      - configured
      - database
      - llama
      - gliner
      properties:
        configured:
          $ref: '#/components/schemas/SettingsDto'
          description: |-
            The values the daemon starts from.
            The settings page shows them while the database does not answer.
        database:
          $ref: '#/components/schemas/DependencyDto'
          description: The database that stores every setting.
        gliner:
          $ref: '#/components/schemas/DependencyDto'
          description: The built in GLiNER resolver.
        llama:
          $ref: '#/components/schemas/LlamaDependencyDto'
          description: The llama.cpp server that reads intents and values.
    DependencyDto:
      type: object
      description: |-
        One dependency a setting needs.

        A setting belongs to a place that stores it and to a service that
        makes it work. The settings page keeps a control usable only when
        every place it needs answers, so the user never saves a value that
        cannot take effect.
      required:
      - key
      - label
      - reachable
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Why it does not answer, or what it reports about itself.
        key:
          type: string
          description: Short key of the dependency, for example `database`.
        label:
          type: string
          description: Name the settings page shows.
        reachable:
          type: boolean
          description: Whether the dependency answers.
    EntityKindDto:
      type: string
      description: The kind of one entity of an intent.
      enum:
      - open
      - closed
      - script
    GlinerDownloadDto:
      type: object
      description: The GLiNER download that runs right now.
      required:
      - model
      - receivedBytes
      - done
      properties:
        done:
          type: boolean
          description: Whether the download finished.
        error:
          type:
          - string
          - 'null'
          description: The error that stopped the download, or null.
        model:
          type: string
          description: Identifier of the model.
        receivedBytes:
          type: integer
          format: int64
          description: Bytes written so far.
          minimum: 0
        totalBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Size the server announced, or null when it announced none.
          minimum: 0
    GlinerModelDto:
      type: object
      description: One GLiNER model the daemon can download.
      required:
      - id
      - name
      - note
      - sizeBytes
      - installed
      properties:
        id:
          type: string
          description: Identifier of the model, for example `gliner_small-v2.1`.
        installed:
          type: boolean
          description: Whether the model is on disk.
        name:
          type: string
          description: Name the settings page shows.
        note:
          type: string
          description: One sentence about the model.
        sizeBytes:
          type: integer
          format: int64
          description: Size of the download in bytes.
          minimum: 0
    GlinerStoreDto:
      type: object
      description: State of the built in GLiNER models.
      required:
      - model
      - device
      - activeDevice
      - installed
      - threshold
      - modelsDir
      - devices
      - cudaBuild
      - models
      properties:
        activeDevice:
          type: string
          description: The device the selected model would run on now.
        cudaBuild:
          type: boolean
          description: Whether this build carries CUDA support.
        device:
          type: string
          description: The device the selected model should run on.
        devices:
          type: array
          items:
            type: string
          description: Devices this build and this machine can run on, best first.
        download:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GlinerDownloadDto'
            description: The download that runs right now, or null.
        installed:
          type: boolean
          description: Whether the selected model is installed.
        model:
          type: string
          description: Identifier of the selected model.
        models:
          type: array
          items:
            $ref: '#/components/schemas/GlinerModelDto'
          description: Every model the daemon can download.
        modelsDir:
          type: string
          description: Directory that holds the downloaded models.
        threshold:
          type: number
          format: float
          description: Smallest probability a label needs to count.
    HealthDto:
      type: object
      description: Health reply of `GET /api/health`.
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Service status.
        version:
          type: string
          description: Daemon version.
    IntentDto:
      type: object
      description: One intent of the daemon. An intent runs one shell command.
      required:
      - id
      - name
      - description
      - command
      - entities
      - createdAt
      - updatedAt
      properties:
        command:
          type: string
          description: Shell command the daemon runs for this intent.
        createdAt:
          type: string
          format: date-time
          description: Time the daemon created the intent, in ISO 8601.
        description:
          type: string
          description: What the intent does, in one sentence. The resolver reads it.
        entities:
          type: array
          items:
            $ref: '#/components/schemas/IntentEntityDto'
          description: The entities the intent reads from the message.
        examples:
          type: array
          items:
            type: string
          description: |-
            Phrases a user may say for this intent, one per entry.

            The resolver reads them next to the name, so "launch firefox"
            points at `open application` as well as the name does.
        id:
          type: string
          format: uuid
          description: Stable intent identifier.
        name:
          type: string
          description: Unique name the resolver chooses from, for example `get weather`.
        updatedAt:
          type: string
          format: date-time
          description: Time the daemon last stored the intent, in ISO 8601.
    IntentEntityDto:
      type: object
      description: One entity of an intent.
      required:
      - id
      - name
      - kind
      - values
      properties:
        id:
          type: string
          format: uuid
          description: Stable entity identifier.
        kind:
          $ref: '#/components/schemas/EntityKindDto'
          description: Whether the entity is open or closed.
        name:
          type: string
          description: Name of the entity, for example `city`.
        required:
          type: boolean
          description: |-
            Whether the intent needs a value for this entity.

            A required entity the daemon cannot read makes the turn ask the
            user for the value. An optional entity the daemon cannot read lets
            the command run without it.
        script:
          type:
          - string
          - 'null'
          description: Shell command that provides the values of a script entity, or none.
        values:
          type: array
          items:
            type: string
          description: Values of a closed entity. An open entity has none.
    IntentEntityWriteDto:
      type: object
      description: One entity of the body of `POST /api/v1/intents` and `PUT /api/v1/intents/{id}`.
      required:
      - name
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/EntityKindDto'
          description: Whether the entity is open or closed.
        name:
          type: string
          description: Name of the entity.
        required:
          type: boolean
          description: Whether the intent needs a value for this entity. It defaults to yes.
        script:
          type:
          - string
          - 'null'
          description: Shell command that provides the values of a script entity.
        values:
          type: array
          items:
            type: string
          description: Values of a closed entity. An open entity sends none.
    IntentListDto:
      type: object
      description: Reply of `GET /api/v1/intents`.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntentDto'
          description: The intents, in name order.
    IntentWriteDto:
      type: object
      description: |-
        Body of `POST /api/v1/intents` and `PUT /api/v1/intents/{id}`.
        The daemon replaces the entity set of the intent with the sent one.
      required:
      - name
      - description
      - command
      properties:
        command:
          type: string
          description: Shell command the daemon runs for this intent.
        description:
          type: string
          description: What the intent does, in one sentence.
        entities:
          type: array
          items:
            $ref: '#/components/schemas/IntentEntityWriteDto'
          description: The entities the intent reads from the message.
        examples:
          type: array
          items:
            type: string
          description: Phrases a user may say for this intent, one per entry.
        name:
          type: string
          description: Unique name of the intent.
    LabelBudgetDto:
      type: object
      description: How many labels the intent configuration adds up to.
      required:
      - labels
      - softLimit
      - hardLimit
      - intents
      - overSoft
      - overHard
      properties:
        hardLimit:
          type: integer
          description: Number of labels a GLiNER model reads before it degrades.
          minimum: 0
        intentLimit:
          type:
          - integer
          - 'null'
          description: |-
            Number of intents the resolver can offer, or null when it has no
            limit. The layered router reads a catalog of any size, because
            only the short list of one turn reaches a model.
          minimum: 0
        intents:
          type: integer
          description: Number of configured intents.
          minimum: 0
        labels:
          type: integer
          description: |-
            Number of labels a GLiNER model reads for this configuration.
            One label per intent, plus one per entity, plus one per value of
            a closed entity.
          minimum: 0
        overHard:
          type: integer
          description: Number of labels that are past the hard limit, or zero.
          minimum: 0
        overSoft:
          type: integer
          description: Number of labels that are past the soft limit, or zero.
          minimum: 0
        softLimit:
          type: integer
          description: Number of labels a GLiNER model reads comfortably.
          minimum: 0
        warning:
          type:
          - string
          - 'null'
          description: The warning the settings page shows, or null.
    LibrarianLintDto:
      type: object
      description: The report of the memory linter.
      required:
      - duplicates
      - orphans
      - closed
      properties:
        closed:
          type: array
          items:
            $ref: '#/components/schemas/MemoryFactDto'
          description: Relations a newer relation replaced. They stay readable.
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/MemoryNodeDto'
          description: |-
            Nodes two keys name, so the memory holds one thing twice. Every
            node of such a pair is reported, because either may take the other.
        orphans:
          type: array
          items:
            $ref: '#/components/schemas/MemoryNodeDto'
          description: Nodes that no relation reaches, so nothing links to them.
    LibrarianStatusDto:
      type: object
      description: |-
        The state of the librarian as the settings page sees it.

        The librarian is a store beside the conversation store, so the page
        reports what the store holds and whether the model that writes it
        answers. A model that is down leaves the seeding of a turn alone: the
        store still answers, it just stops learning.
      required:
      - enabled
      - baseUrl
      - model
      - reachable
      - nodes
      - edges
      - currentEdges
      - confirmedEdges
      - pendingEpisodes
      - ingestedEpisodes
      properties:
        baseUrl:
          type: string
          description: The address of the model server the librarian reads.
        confirmedEdges:
          type: integer
          format: int64
          description: Number of stored edges a later turn taught again.
          minimum: 0
        currentEdges:
          type: integer
          format: int64
          description: Number of stored edges that are true now.
          minimum: 0
        detail:
          type:
          - string
          - 'null'
          description: Why the server does not answer, or null.
        edges:
          type: integer
          format: int64
          description: Number of stored memory edges, closed edges included.
          minimum: 0
        enabled:
          type: boolean
          description: Whether the daemon keeps a memory at all.
        ingestedEpisodes:
          type: integer
          format: int64
          description: Number of episodes the worker read.
          minimum: 0
        model:
          type: string
          description: The model the librarian reads.
        nodes:
          type: integer
          format: int64
          description: Number of stored memory nodes.
          minimum: 0
        pendingEpisodes:
          type: integer
          format: int64
          description: Number of stored episodes the worker has not read yet.
          minimum: 0
        reachable:
          type: boolean
          description: Whether the model server answers.
    LlamaDependencyDto:
      type: object
      description: The llama.cpp server as the settings page sees it.
      required:
      - reachable
      - baseUrl
      - model
      - models
      properties:
        baseUrl:
          type: string
          description: The address the daemon asked.
        detail:
          type:
          - string
          - 'null'
          description: Why it does not answer, or null.
        model:
          type: string
          description: The model the daemon stored.
        models:
          type: array
          items:
            type: string
          description: The models the server offers. Empty when the server is down.
        reachable:
          type: boolean
          description: Whether the server answers.
    LlamaStatusDto:
      type: object
      description: Configuration of the llama.cpp resolver.
      required:
      - baseUrl
      - model
      - intentLimit
      properties:
        baseUrl:
          type: string
          description: Base URL of the llama.cpp server.
        intentLimit:
          type: integer
          description: Number of intents the resolver can offer.
          minimum: 0
        model:
          type: string
          description: Model name the server answers to.
    LocalDownloadDto:
      type: object
      description: The download of one built in model of the router that runs right now.
      required:
      - model
      - receivedBytes
      - done
      properties:
        done:
          type: boolean
          description: Whether the download finished.
        error:
          type:
          - string
          - 'null'
          description: The error that stopped the download, or null.
        model:
          type: string
          description: Identifier of the model.
        receivedBytes:
          type: integer
          format: int64
          description: Bytes written so far.
          minimum: 0
        totalBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Size the server announced, or null when it announced none.
          minimum: 0
    LocalModelDto:
      type: object
      description: One built in model of the router the daemon can download.
      required:
      - id
      - name
      - note
      - role
      - sizeBytes
      - installed
      properties:
        id:
          type: string
          description: Identifier of the model, for example `bge-small-en-v1.5`.
        installed:
          type: boolean
          description: Whether the model is on disk.
        name:
          type: string
          description: Name the settings page shows.
        note:
          type: string
          description: One sentence about the model.
        role:
          type: string
          description: 'What the model reads: `embeddings`, `reranker`, or `decision`.'
        sizeBytes:
          type: integer
          format: int64
          description: Size of the download in bytes.
          minimum: 0
    LocalStoreDto:
      type: object
      description: State of the built in models of the router.
      required:
      - modelsDir
      - models
      properties:
        download:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LocalDownloadDto'
            description: The download that runs right now, or null.
        models:
          type: array
          items:
            $ref: '#/components/schemas/LocalModelDto'
          description: Every model the daemon can download.
        modelsDir:
          type: string
          description: Directory that holds the downloaded models.
    MemoryFactDto:
      type: object
      description: One dated relation of one memory node.
      required:
      - id
      - relation
      - value
      - current
      - confidence
      - importance
      - confirmations
      - lastConfirmedAt
      - validAt
      properties:
        confidence:
          type: number
          format: float
          description: How sure the reader was of the fact, from zero to one.
        confirmations:
          type: integer
          format: int32
          description: Number of later turns that taught the same fact again.
        current:
          type: boolean
          description: Whether the fact is true now.
        id:
          type: string
          format: uuid
          description: Stable identifier of the fact.
        importance:
          type: number
          format: float
          description: How much the fact is worth, from zero to one.
        invalidAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Time the fact stopped being true, or null while it is current.
        lastConfirmedAt:
          type: string
          format: date-time
          description: Time the memory last saw the fact, in ISO 8601.
        relation:
          type: string
          description: The relation the fact names, for example `lives_in`.
        validAt:
          type: string
          format: date-time
          description: Time the fact became true, in ISO 8601.
        value:
          type: string
          description: The value the fact carries.
    MemoryFactWriteDto:
      type: object
      description: One relation a write gives to a node.
      required:
      - relation
      - value
      properties:
        relation:
          type: string
          description: The relation the fact names.
        value:
          type: string
          description: The value the fact carries.
    MemoryMergeRequestDto:
      type: object
      description: |-
        Body of a memory merge.

        The concept the request names keeps its key and its facts, and the
        concept in the path moves into it: its facts move as they stand, its
        key becomes a name of the target, and the empty concept goes.
      required:
      - into
      properties:
        into:
          type: string
          format: uuid
          description: Identifier of the concept that absorbs the other.
    MemoryNodeDto:
      type: object
      description: One memory node with its facts.
      required:
      - id
      - key
      - title
      - body
      - facts
      - createdAt
      - updatedAt
      properties:
        body:
          type: string
          description: The body of the concept in plain text.
        createdAt:
          type: string
          format: date-time
          description: Time the daemon stored the node, in ISO 8601.
        facts:
          type: array
          items:
            $ref: '#/components/schemas/MemoryFactDto'
          description: The relations of the node, current first.
        id:
          type: string
          format: uuid
          description: Stable identifier of the node.
        key:
          type: string
          description: The key that names the node, for example `user`.
        title:
          type: string
          description: The name the memory shows.
        updatedAt:
          type: string
          format: date-time
          description: Time the daemon last changed the node, in ISO 8601.
    MemoryQueryDto:
      type: object
      description: Reply of a memory query.
      required:
      - nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/MemoryNodeDto'
          description: The nodes the query matched, best first.
    MemoryQueryRequestDto:
      type: object
      description: Body of the memory query.
      required:
      - text
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Largest number of nodes to return.
          minimum: 0
        text:
          type: string
          description: The words to search the memory for. Empty returns the recent nodes.
    MemorySavedFactDto:
      type: object
      description: One fact that one turn taught the long term memory.
      required:
      - concept
      - relation
      - value
      properties:
        concept:
          type: string
          description: The name of the concept the fact belongs to.
        relation:
          type: string
          description: The relation the fact names.
        value:
          type: string
          description: The value the fact carries.
    MemoryWriteRequestDto:
      type: object
      description: Body of a memory write.
      required:
      - key
      - title
      - body
      - facts
      properties:
        body:
          type: string
          description: The body of the concept.
        facts:
          type: array
          items:
            $ref: '#/components/schemas/MemoryFactWriteDto'
          description: |-
            The relations to write. A relation with a new value closes the
            older value rather than deleting it.
        key:
          type: string
          description: The key that names the node. An existing key is enriched.
        title:
          type: string
          description: The name the memory shows.
    MessageCandidateDto:
      type: object
      description: One intent the retrieval pass offered for a turn.
      required:
      - name
      - score
      - evidence
      properties:
        evidence:
          type: string
          description: Which evidence read the score, for example `words` or `embedding`.
        name:
          type: string
          description: Name of the intent.
        score:
          type: number
          format: float
          description: The score of the intent for this turn, between 0 and 1.
    MessageEntityDto:
      type: object
      description: |-
        One entity of an intent with the value the resolver read for it.

        A value is read by one reader of the pipeline, and which one read it is
        what tells a value the daemon proved from a value a model guessed, so
        the read is reported next to the value it produced.
      required:
      - name
      - value
      properties:
        engine:
          type:
          - string
          - 'null'
          description: |-
            The engine that ran the reader, or null when the daemon read the
            value itself.
        model:
          type:
          - string
          - 'null'
          description: The model the reader ran, or null when it ran none.
        name:
          type: string
          description: Name of the entity, for example `city`.
        read:
          type:
          - string
          - 'null'
          description: |-
            What the reader read before the value was matched to an entry of a
            list, or null when the value is the entry itself.
        score:
          type:
          - number
          - 'null'
          format: float
          description: |-
            The similarity the match read, between 0 and 1, or null when the
            reader reported no score.
        source:
          type:
          - string
          - 'null'
          description: |-
            How the daemon read the value, or null when it read none:
            `fast_path`, `list`, `embedding`, `spans`, or `model`.
        value:
          type: string
          description: The value the resolver read, empty when it read none.
    MessageMemoryDto:
      type: object
      description: |-
        What one turn taught the long term memory.

        The memory learns from the turns that met no intent, and it writes them
        in the background. This is what a reader sees of that work: the facts
        the turn taught, each with the concept it belongs to.
      required:
      - facts
      properties:
        facts:
          type: array
          items:
            $ref: '#/components/schemas/MemorySavedFactDto'
          description: The facts the turn taught, in the order the memory wrote them.
    MessageMetaDto:
      type: object
      description: |-
        How the daemon read one handled turn.

        The resolver owns two steps: it chooses the intent, and it reads the
        values of the entities of that intent. Either step may run on the
        llama.cpp server or on the built in GLiNER model, so a turn reports
        the engine of each step. The rest of the metadata is what the daemon
        then ran, so the transcript can explain a stored turn.
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MessageCandidateDto'
          description: |-
            The intents the retrieval pass kept for this turn, best first.

            The short list is the evidence of the decision, so a user who
            reads `no intent matched` still reads what the catalog offered.
        command:
          type:
          - string
          - 'null'
          description: The command after the daemon put the values in, or null.
        durationMs:
          type:
          - integer
          - 'null'
          format: int64
          description: How long the command ran, in milliseconds, or null when none ran.
          minimum: 0
        entities:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntityDto'
          description: The entities of the intent with the values the daemon read.
        exitCode:
          type:
          - integer
          - 'null'
          format: int32
          description: The exit code of the command, or null when none ran.
        intentEngine:
          type:
          - string
          - 'null'
          description: The engine that chose the intent, or null when none chose one.
        intentModel:
          type:
          - string
          - 'null'
          description: The model that engine ran, or null when the daemon cannot name it.
        memorySeed:
          type:
          - string
          - 'null'
          description: |-
            The concepts the daemon read from the long term memory for this
            turn, as plain text, or null when the memory carried none.

            The memory belongs to the branch that no intent matches, so only a
            turn without an intent reports what the daemon read of it: the
            facts the answer of the turn leaned on.
        resolveMs:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            How long the daemon needed to read the turn, in milliseconds, or
            null when it did not measure the read.

            The read runs from the queued message to the command, so a slow
            turn is told apart from a slow command: the duration above is the
            command alone and this is the resolver.
          minimum: 0
        route:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MessageRouteDto'
            description: |-
              How the layered router read the turn, stage by stage, or null when
              the backend of the turn is not the router.

              The stage above names the stage that decided, and this names every
              stage the turn passed with the reader it ran and the short list it
              read, so a stored turn can be read back the way the daemon read it.
        scriptId:
          type:
          - string
          - 'null'
          description: |-
            The identifier of the script the model wrote for this turn, or
            null when the model answered in words.

            The store keeps the script, so a user can still decide about a
            turn that a restart or a closed socket left behind.
        stage:
          type:
          - string
          - 'null'
          description: |-
            The stage of the layered router that decided the turn, or null
            when the backend of the turn is not the router.

            A turn the deterministic pass proved reads `fast_path`, a turn the
            retrieval scores decided reads `retrieve`, and a turn a model
            chose from the short list reads `rerank`.
        valueEngine:
          type:
          - string
          - 'null'
          description: The engine that read the entity values, or null when none did.
        valueModel:
          type:
          - string
          - 'null'
          description: The model that engine ran, or null when the daemon cannot name it.
    MessageRouteDto:
      type: object
      description: |-
        How the layered router read one turn, stage by stage.

        The stages of the router run in order and the first one that can answer
        ends the turn, so the stages a turn passed are its route. The route
        carries the reader every stage ran and the short list it read, which is
        what a reader of the transcript needs to see why a message met an
        intent, met none, or was answered by a stage it did not expect.
      required:
      - matched
      properties:
        matched:
          type: boolean
          description: True when the turn met an intent.
        reason:
          type:
          - string
          - 'null'
          description: Why the router refused, or null when it chose.
        stage:
          type:
          - string
          - 'null'
          description: The stage that decided the turn, or null when the router refused.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/MessageRouteStepDto'
          description: The stages the turn passed, in the order they ran.
    MessageRouteStepDto:
      type: object
      description: |-
        One stage of the layered router in one turn.

        Every stage reports what it read and how it ended, so a turn that a
        model answered and a turn the words answered are told apart, and a
        stage that fell back to its cheaper reader says so.
      required:
      - stage
      - outcome
      - reader
      - durationMs
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MessageCandidateDto'
          description: The candidates the stage read, best first.
        detail:
          type:
          - string
          - 'null'
          description: One sentence about what the stage read, or null.
        durationMs:
          type: integer
          format: int64
          description: How long the stage took, in milliseconds.
          minimum: 0
        model:
          type:
          - string
          - 'null'
          description: The model the reader ran, or null when it ran none.
        outcome:
          type: string
          description: |-
            How the stage ended: `matched`, `refused`, `passed`, `fell_back`,
            or `skipped`.
        reader:
          type: string
          description: |-
            The reader the stage ran, for example `rules`, `words`, `reranker`,
            or `model`.
        stage:
          type: string
          description: 'The stage: `fast_path`, `retrieve`, `decide`, or `extract`.'
    OutputStreamDto:
      type: string
      description: The stream a command wrote one line to.
      enum:
      - stdout
      - stderr
    ResolverPreviewDto:
      type: object
      description: |-
        Reply of `POST /api/v1/resolver/preview`.

        The preview carries the same metadata a stored turn carries, so a
        sentence the user tries is read with the same report as a message the
        daemon really handled, minus the run. The intent it met, the reader
        that read every value, and the route the message took are the report a
        user tunes the pipeline by.
      required:
      - text
      - matched
      - reply
      properties:
        confidence:
          type:
          - number
          - 'null'
          format: float
          description: The probability of the choice, or null when the resolver sent none.
        intent:
          type:
          - string
          - 'null'
          description: The name of the intent the resolver met, or null when it met none.
        matched:
          type: boolean
          description: True when the resolver met an intent.
        meta:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MessageMetaDto'
            description: How the daemon read the turn, or null when it read nothing at all.
        reply:
          type: string
          description: |-
            The reply the daemon would store, or empty when the turn would run
            the command of its intent.
        text:
          type: string
          description: The message the daemon read.
    ResolverPreviewRequestDto:
      type: object
      description: |-
        Body of `POST /api/v1/resolver/preview`.

        A preview reads one message the way a turn would and runs nothing, so
        the settings page can show the route of a sentence before the user
        sends it.
      required:
      - text
      properties:
        text:
          type: string
          description: The message to read.
    ResolverStatusDto:
      type: object
      description: |-
        Reply of `GET /api/v1/resolver`.
        This tells the settings page which engines are ready to work.
      required:
      - backend
      - llama
      - gliner
      - budget
      - router
      properties:
        backend:
          type: string
          description: The engine that reads the intent of a message.
        budget:
          $ref: '#/components/schemas/LabelBudgetDto'
          description: How many labels the intent configuration adds up to.
        gliner:
          $ref: '#/components/schemas/GlinerStoreDto'
          description: State of the built in GLiNER models.
        llama:
          $ref: '#/components/schemas/LlamaStatusDto'
          description: Configuration of the llama.cpp resolver.
        router:
          $ref: '#/components/schemas/RouterStatusDto'
          description: The state of the layered router.
    RouterPresetDto:
      type: object
      description: One preset that maps a quality value to a router configuration.
      required:
      - quality
      - speed
      - label
      - description
      - router
      properties:
        description:
          type: string
          description: One sentence about the preset.
        label:
          type: string
          description: Short label of the preset, for example `Balanced`.
        quality:
          type: integer
          format: int32
          description: Quality between 0 and 100. 0 is fastest, 100 is best.
          minimum: 0
        router:
          $ref: '#/components/schemas/RouterStatusDto'
          description: Router configuration of the preset.
        speed:
          type: integer
          format: int32
          description: Speed between 0 and 100. Always 100 - quality.
          minimum: 0
    RouterStatusDto:
      type: object
      description: |-
        The state of the layered router.

        The router has a stage per setting, and each stage names the reader it
        would use right now. The settings page shows that state, so a stage
        that cannot run its reader says so before a turn depends on it.
      required:
      - fastPath
      - retrieve
      - decide
      - extract
      - topK
      - floor
      - margin
      - lexicalWeight
      - denseWeight
      - embedModel
      - embedSource
      - embedLocalModel
      - rerankModel
      - layaModel
      - localDevice
      - activeLocalDevice
      - local
      - phraseGate
      - listMatch
      - listFloor
      - embeddingsReachable
      properties:
        activeLocalDevice:
          type: string
          description: The device a built in model of the router would run on now.
        decide:
          type: string
          description: How the decision pass chooses one of the short list.
        denseWeight:
          type: number
          format: float
          description: Weight of the embeddings of the catalog.
        embedLocalModel:
          type: string
          description: Identifier of the built in embedding model.
        embedModel:
          type: string
          description: Model name the embedding server answers to.
        embedSource:
          type: string
          description: Where the retrieval stage and the list matcher read the vectors.
        embeddingsDetail:
          type:
          - string
          - 'null'
          description: Why the model server answers with no embeddings, or null.
        embeddingsReachable:
          type: boolean
          description: Whether the model server answers the router with embeddings.
        extract:
          type: string
          description: How the values of the entities of the chosen intent are read.
        fastPath:
          type: boolean
          description: Whether the deterministic pass reads the message first.
        floor:
          type: number
          format: float
          description: Smallest score the decision pass accepts.
        layaModel:
          type: string
          description: Identifier of the built in decision model.
        lexicalWeight:
          type: number
          format: float
          description: Weight of the words of the catalog.
        listFloor:
          type: number
          format: float
          description: Smallest cosine similarity an embedding match of a value needs.
        listMatch:
          type: string
          description: How a mention is read against the values of an entity.
        local:
          $ref: '#/components/schemas/LocalStoreDto'
          description: State of the built in models of the router.
        localDevice:
          type: string
          description: The device a built in model of the router runs on.
        margin:
          type: number
          format: float
          description: Smallest distance between the best and the second best.
        phraseGate:
          type: boolean
          description: Whether a phrase counts only when the message shares its action.
        rerankModel:
          type: string
          description: Identifier of the built in reranker.
        retrieve:
          type: string
          description: The evidence the retrieval pass ranks the catalog with.
        topK:
          type: integer
          description: Size of the short list the retrieval pass keeps.
          minimum: 0
    ScriptDto:
      type: object
      description: One shell script that waits for the decision of the user.
      required:
      - id
      - requestText
      - summary
      - script
      - destructiveness
      - status
      - createdAt
      properties:
        conversationId:
          type:
          - string
          - 'null'
          format: uuid
          description: Conversation the turn belongs to, or null when the queue is off.
        createdAt:
          type: string
          format: date-time
          description: Time the daemon stored the script, in ISO 8601.
        destructiveness:
          type: integer
          format: int32
          description: How rough the script is on the machine, between 0 and 100.
          minimum: 0
        id:
          type: string
          format: uuid
          description: Stable identifier of the script.
        requestText:
          type: string
          description: The message the model wrote the script for.
        script:
          type: string
          description: The shell script.
        status:
          type: string
          description: 'The decision of the user: pending, approved, denied, or ran.'
        summary:
          type: string
          description: One sentence about what the script does.
    ScriptPreviewDto:
      type: object
      description: |-
        Reply of `POST /api/v1/intents/script/preview`.

        The settings page shows the values a script answers with, so a user
        who writes one reads the list before it reaches a turn.
      required:
      - values
      - durationMs
      properties:
        durationMs:
          type: integer
          format: int64
          description: How long the script ran, in milliseconds.
          minimum: 0
        error:
          type:
          - string
          - 'null'
          description: Why the script did not answer, or none when it did.
        exitCode:
          type:
          - integer
          - 'null'
          format: int32
          description: The exit code of the script, or none when it did not start.
        values:
          type: array
          items:
            type: string
          description: The values the script wrote, in the order it wrote them.
    ScriptPreviewWriteDto:
      type: object
      description: Body of `POST /api/v1/intents/script/preview`.
      required:
      - script
      properties:
        script:
          type: string
          description: The shell command the daemon runs for the preview.
    SettingsDto:
      type: object
      description: Reply of `GET /api/v1/settings` and `PUT /api/v1/settings`.
      required:
      - queueEnabled
      - resolverBackend
      - resolverBaseUrl
      - resolverModel
      - glinerModel
      - glinerDevice
      - glinerThreshold
      - routerFastPath
      - routerRetrieve
      - routerDecide
      - routerExtract
      - routerTopK
      - routerFloor
      - routerMargin
      - routerLexicalWeight
      - routerDenseWeight
      - routerEmbedModel
      - routerModelsDir
      - routerEmbedSource
      - routerEmbedLocalModel
      - routerRerankModel
      - routerLayaModel
      - routerLocalDevice
      - routerPhraseGate
      - routerListMatch
      - routerListFloor
      - routerFallbackLlm
      - routerScriptFallback
      - routerOpenValuesLlm
      - responseQuality
      - responseSpeed
      - previewSentences
      - librarianEnabled
      - librarianBaseUrl
      - librarianModel
      properties:
        glinerDevice:
          type: string
          description: The device a GLiNER model runs on.
        glinerModel:
          type: string
          description: Identifier of the built in GLiNER model.
        glinerThreshold:
          type: number
          format: float
          description: Smallest probability a GLiNER label needs to count.
        librarianBaseUrl:
          type: string
          description: Base URL of the model server the librarian reads.
        librarianEnabled:
          type: boolean
          description: Whether the librarian keeps a long term memory.
        librarianModel:
          type: string
          description: Model name the librarian server answers to.
        previewSentences:
          type: array
          items:
            type: string
          description: |-
            The sentences the settings page tries against the resolver.

            The sentences are the tests of a user and not a setting of the
            pipeline, so they are stored with the settings the page shows and
            never reach a turn.
        queueEnabled:
          type: boolean
          description: Whether the queue stores messages.
        resolverBackend:
          type: string
          description: The engine that reads the intent of a message.
        resolverBaseUrl:
          type: string
          description: Base URL of the intent resolver.
        resolverModel:
          type: string
          description: Model name the intent resolver asks the server for.
        responseQuality:
          type: integer
          format: int32
          description: |-
            Response quality between 0 and 100. 0 is fastest, 100 is best.
            Speed is 100 - quality. The value lerps between the minimum
            successful settings and the maximum quality settings.
          minimum: 0
        responseSpeed:
          type: integer
          format: int32
          description: Response speed between 0 and 100. Always 100 - quality.
          minimum: 0
        routerDecide:
          type: string
          description: How the decision pass chooses one of the short list.
        routerDenseWeight:
          type: number
          format: float
          description: Weight of the embeddings of the catalog.
        routerEmbedLocalModel:
          type: string
          description: Identifier of the built in embedding model.
        routerEmbedModel:
          type: string
          description: Model name the embedding server answers to.
        routerEmbedSource:
          type: string
          description: Where the retrieval stage and the list matcher read the vectors.
        routerExtract:
          type: string
          description: How the values of the entities of the chosen intent are read.
        routerFallbackLlm:
          type: boolean
          description: Whether the language model answers a message no intent matched.
        routerFastPath:
          type: boolean
          description: Whether the deterministic pass of the router reads the message first.
        routerFloor:
          type: number
          format: float
          description: Smallest score the decision pass accepts.
        routerLayaModel:
          type: string
          description: Identifier of the built in decision model.
        routerLexicalWeight:
          type: number
          format: float
          description: Weight of the words of the catalog.
        routerListFloor:
          type: number
          format: float
          description: Smallest cosine similarity an embedding match of a value needs.
        routerListMatch:
          type: string
          description: How a mention is read against the values of an entity.
        routerLocalDevice:
          type: string
          description: The device a built in model of the router runs on.
        routerMargin:
          type: number
          format: float
          description: Smallest distance between the best and the second best.
        routerModelsDir:
          type: string
          description: Directory that holds the downloaded models of the router.
        routerOpenValuesLlm:
          type: boolean
          description: |-
            Whether the language model reads an open value the built in reader
            found none of.
        routerPhraseGate:
          type: boolean
          description: Whether a phrase counts only when the message shares its action.
        routerRerankModel:
          type: string
          description: Identifier of the built in reranker.
        routerRetrieve:
          type: string
          description: The evidence the retrieval pass ranks the catalog with.
        routerScriptFallback:
          type: boolean
          description: |-
            Whether the language model may write a shell script for a message
            no intent matched. The daemon runs no script without approval.
        routerTopK:
          type: integer
          description: Size of the short list the retrieval pass keeps.
          minimum: 0
    SettingsUpdateDto:
      type: object
      description: |-
        Body of `PUT /api/v1/settings`.
