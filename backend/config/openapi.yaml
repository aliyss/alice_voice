          description: Whether the language model answers a message no intent matched.
        routerFastPath:
          type:
          - boolean
          - 'null'
          description: Whether the deterministic pass of the router reads the message first.
        routerFloor:
          type:
          - number
          - 'null'
          format: float
          description: Smallest score the decision pass accepts.
        routerLayaModel:
          type:
          - string
          - 'null'
          description: Identifier of the built in decision model.
        routerLexicalWeight:
          type:
          - number
          - 'null'
          format: float
          description: Weight of the words of the catalog.
        routerListFloor:
          type:
          - number
          - 'null'
          format: float
          description: Smallest cosine similarity an embedding match of a value needs.
        routerListMatch:
          type:
          - string
          - 'null'
          description: How a mention is read against the values of an entity.
        routerLocalDevice:
          type:
          - string
          - 'null'
          description: The device a built in model of the router runs on.
        routerMargin:
          type:
          - number
          - 'null'
          format: float
          description: Smallest distance between the best and the second best.
        routerModelsDir:
          type:
          - string
          - 'null'
          description: Directory that holds the downloaded models of the router.
        routerOpenValuesLlm:
          type:
          - boolean
