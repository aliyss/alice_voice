name: alice-web
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    image: alice-voice-web:dev
    container_name: alice-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      PUBLIC_ALICE_API_URL: ${PUBLIC_ALICE_API_URL:-http://127.0.0.1:8787}
    volumes:
      - ../frontend-web:/app/frontend-web:cached
      - /app/frontend-web/node_modules
    restart: unless-stopped
