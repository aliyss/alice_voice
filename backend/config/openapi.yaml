    StatusDto:
      type: object
      description: Reply of `GET /api/v1/status`.
      required:
      - state
      - since
      - version
      properties:
        since:
          type: string
          format: date-time
          description: Time the daemon entered the state, in ISO 8601.
        state:
          $ref: '#/components/schemas/DaemonStateDto'
          description: Current daemon state.
        version:
          type: string
          description: Daemon version.
    StopReasonDto:
      type: string
      description: Reason why the daemon left the Listening state.
      enum:
      - SilenceTimeout
      - UserStopped
      - WakeDetected
      - Error
    SystemCpuCoreDto:
      type: object
      description: One logical processor of the host.
      required:
      - name
      - brand
      - vendor
      - frequencyMhz
      - usagePercent
      properties:
        brand:
          type: string
          description: Brand of the core, for example `Intel(R) Core(TM) i7`.
        frequencyMhz:
          type: integer
          format: int64
          description: Frequency of the core in MHz.
          minimum: 0
        name:
          type: string
          description: Name of the core, for example `cpu0`.
        usagePercent:
          type: number
          format: float
          description: Usage of the core in percent between 0 and 100.
        vendor:
          type: string
          description: Vendor of the core.
    SystemCpuDto:
      type: object
      description: Processor summary of the host.
      required:
      - brand
      - vendor
      - logicalCores
      - frequencyMhz
      - usagePercent
      - cores
      properties:
        brand:
          type: string
          description: Brand of the processor.
        cores:
          type: array
          items:
            $ref: '#/components/schemas/SystemCpuCoreDto'
          description: Every logical core.
        frequencyMhz:
          type: integer
          format: int64
          description: Frequency of the processor in MHz.
          minimum: 0
        logicalCores:
          type: integer
          description: Number of logical cores.
          minimum: 0
        physicalCores:
          type:
          - integer
          - 'null'
          description: Number of physical cores, or null when the host does not report it.
          minimum: 0
        usagePercent:
          type: number
          format: float
          description: Average usage of the processor in percent between 0 and 100.
        vendor:
          type: string
          description: Vendor identifier.
    SystemDevicesDto:
      type: object
      description: Devices the daemon can use for built in models.
      required:
      - cudaBuild
      - cudaAvailable
      - availableDevices
      - activeDevice
      - activeLocalDevice
      - glinerModelsInstalled
      - routerModelsInstalled
      - gpus
      properties:
        activeDevice:
          type: string
          description: The device the selected GLiNER model would run on now.
        activeLocalDevice:
          type: string
          description: The device the router models would run on now.
        availableDevices:
          type: array
          items:
            type: string
          description: Devices this build and this machine offer, best first.
        cudaAvailable:
          type: boolean
          description: Whether ONNX Runtime can use a CUDA device right now.
        cudaBuild:
          type: boolean
          description: Whether this build carries CUDA support.
        glinerModelsInstalled:
          type: integer
          description: Number of GLiNER models on disk.
          minimum: 0
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/SystemGpuDto'
          description: |-
            The graphics devices the daemon can reach, best first.

            A graphics device is what makes a built in model fast, so the page
            names every device with the memory it holds. A machine without a
            graphics device reports an empty list.
        routerModelsInstalled:
          type: integer
          description: Number of router models on disk.
          minimum: 0
    SystemDiskDto:
      type: object
      description: One disk of the host.
      required:
      - name
      - mountPoint
      - fileSystem
      - totalBytes
      - availableBytes
      - isRemovable
      properties:
        availableBytes:
          type: integer
          format: int64
          description: Available space of the disk in bytes.
          minimum: 0
        fileSystem:
          type: string
          description: File system of the disk, for example `ext4`.
        isRemovable:
          type: boolean
          description: Whether the disk is removable.
        mountPoint:
          type: string
          description: Mount point of the disk.
        name:
          type: string
          description: Name of the disk, for example `/dev/sda1`.
        totalBytes:
          type: integer
          format: int64
          description: Total space of the disk in bytes.
          minimum: 0
    SystemEventDto:
      type: object
      description: One event of the socket stream.
      required:
      - at
      - payload
      properties:
        at:
          type: string
          format: date-time
          description: Time the daemon emitted the event, in ISO 8601.
        payload:
          $ref: '#/components/schemas/SystemEventPayloadDto'
          description: Payload of the event, tagged by the backend variant name.
    SystemEventPayloadDto:
      oneOf:
      - type: object
        required:
        - timestamp
        - type
        properties:
          timestamp:
            type: string
            format: date-time
          type:
            type: string
            enum:
            - WakeDetected
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - ListeningStarted
      - type: object
        required:
        - reason
        - type
        properties:
          reason:
            $ref: '#/components/schemas/StopReasonDto'
          type:
            type: string
            enum:
            - ListeningStopped
      - type: object
        required:
        - text
        - type
        properties:
          text:
            type: string
          type:
            type: string
            enum:
            - TranscriptInterim
      - type: object
        required:
        - text
        - type
        properties:
          text:
            type: string
          type:
            type: string
            enum:
            - TranscriptFinal
      - type: object
        required:
        - original
        - corrected
        - type
        properties:
          corrected:
            type: string
          original:
            type: string
          type:
            type: string
            enum:
            - TranscriptCorrected
      - type: object
        description: Token the resolver read from the model while it decides.
        required:
        - delta
        - type
        properties:
          delta:
            type: string
          type:
            type: string
            enum:
            - IntentThinking
      - type: object
        description: |-
          The stage of the resolver that runs right now.

          The resolver reports each stage as it starts, so a surface shows
          the work of a turn step by step instead of one label that never
          changes. A stage that reads a model says so in its own event, so
          this event names the step and not the reader behind it.
        required:
        - stage
        - detail
        - type
        properties:
          detail:
            type: string
            description: One sentence about what the stage is doing, in the present tense.
          stage:
            type: string
            description: |-
              The stage: `fast_path`, `retrieve`, `decide`, `extract`, or
              `answer` for the model that answers a message no intent matched.
          type:
            type: string
            enum:
            - IntentStage
      - type: object
        required:
        - intent
        - engine
        - type
        properties:
          confidence:
            type:
            - number
            - 'null'
            format: float
          engine:
            type: string
            description: The engine that chose the intent.
          intent:
            type: string
          model:
            type:
            - string
            - 'null'
            description: The model that engine ran, or null when the daemon cannot name it.
          type:
            type: string
            enum:
            - IntentResolved
      - type: object
        description: One value the resolver read for an entity of the chosen intent.
        required:
        - engine
        - entities
        - type
        properties:
          engine:
            type: string
            description: The engine that read the values.
          entities:
            type: array
            items:
              $ref: '#/components/schemas/MessageEntityDto'
            description: The entities with the values the engine read.
          model:
            type:
            - string
            - 'null'
            description: The model that engine ran, or null when the daemon cannot name it.
          type:
            type: string
            enum:
            - IntentValuesRead
      - type: object
        required:
        - text
        - type
        properties:
          text:
            type: string
          type:
            type: string
            enum:
            - IntentNotFound
      - type: object
        required:
        - intent
        - command
        - type
        properties:
          command:
            type: string
          intent:
            type: string
          type:
            type: string
            enum:
            - ExecutionStarted
      - type: object
        description: One line the command of an intent wrote to its output.
        required:
        - stream
        - line
        - type
        properties:
          line:
            type: string
          stream:
            $ref: '#/components/schemas/OutputStreamDto'
          type:
            type: string
            enum:
            - ExecutionOutput
      - type: object
        required:
        - intent
        - exit_code
        - duration_ms
        - output
        - type
        properties:
          duration_ms:
            type: integer
            format: int64
            minimum: 0
          exit_code:
            type: integer
            format: int32
          intent:
            type: string
          output:
            type: string
          type:
            type: string
            enum:
            - ExecutionCompleted
      - type: object
        required:
        - intent
        - error
        - type
        properties:
          error:
            type: string
          intent:
            type: string
          type:
            type: string
            enum:
            - ExecutionFailed
      - type: object
        description: Queue event emitted when a chat message is stored.
        required:
        - id
        - type
        properties:
          id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - MessageQueued
      - type: object
        description: Queue event emitted when the daemon replies.
        required:
        - id
        - type
        properties:
          id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - MessageReplied
      - type: object
        description: |-
          The model wrote a shell script for a message no intent matched.

          The daemon runs no script of its own accord, so the event carries
          the script and its rating for the user to approve or deny.
        required:
        - id
        - summary
        - script
        - destructiveness
        - type
        properties:
          destructiveness:
            type: integer
            format: int32
            minimum: 0
          id:
            type: string
            format: uuid
          script:
            type: string
          summary:
            type: string
          type:
            type: string
            enum:
            - ScriptProposed
      - type: object
        description: The user approved one script, so the daemon may run it.
        required:
        - id
        - type
        properties:
          id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - ScriptApproved
      - type: object
        description: The user denied one script, so the daemon runs it never.
        required:
        - id
        - type
        properties:
          id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - ScriptDenied
      - type: object
        description: |-
          The memory learned facts from one stored turn.

          The memory reads a turn after the daemon answered it, so this event
          reaches the surface later than the reply it belongs to. It names the
          message of the turn, so the transcript marks the message the memory
          learned from rather than the turn that happens to be on screen.
        required:
        - message_id
        - facts
        - type
        properties:
          facts:
            type: array
            items:
              $ref: '#/components/schemas/MemorySavedFactDto'
          message_id:
            type: string
            format: uuid
          type:
            type: string
            enum:
            - MemorySaved
      description: Payload of a `SystemEventDto`.
    SystemGpuDto:
      type: object
      description: |-
        One graphics device of the host.

        The settings page reads how much memory a device holds, because the
        memory decides which built in model fits on it. A machine that does not
        report a value reports null rather than a value of zero.
      required:
      - name
      - vendor
      - sharedMemory
      properties:
        driverVersion:
          type:
          - string
          - 'null'
          description: |-
            The version of the driver, or null when the machine does not name
            one.
        memoryFreeBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: The memory free in bytes, or null.
          minimum: 0
        memoryTotalBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The memory of the device in bytes, or null when the device holds
            none of its own or the machine does not report it.
          minimum: 0
        memoryUsedBytes:
          type:
          - integer
          - 'null'
          format: int64
          description: The memory in use in bytes, or null.
          minimum: 0
        name:
          type: string
          description: The name of the device, as the machine reports it.
        sharedMemory:
          type: boolean
          description: |-
            True when the device has no memory of its own and draws on the
            memory of the system.

            An integrated device shares the memory of the machine, so the page
            reads the memory of the host for it rather than a number of zero.
        vendor:
          type: string
          description: 'The maker of the device: `nvidia`, `amd`, or `intel`.'
    SystemMemoryDto:
      type: object
      description: Memory summary of the host.
      required:
      - totalBytes
      - availableBytes
      - usedBytes
      - totalSwapBytes
      - usedSwapBytes
      properties:
        availableBytes:
          type: integer
          format: int64
          description: Available RAM in bytes.
          minimum: 0
        totalBytes:
          type: integer
          format: int64
          description: Total RAM in bytes.
          minimum: 0
        totalSwapBytes:
          type: integer
          format: int64
          description: Total swap in bytes.
          minimum: 0
        usedBytes:
          type: integer
          format: int64
          description: Used RAM in bytes.
          minimum: 0
        usedSwapBytes:
          type: integer
          format: int64
          description: Used swap in bytes.
          minimum: 0
    SystemOsDto:
      type: object
      description: Operating system of the host.
      required:
      - arch
      properties:
        arch:
          type: string
          description: Processor architecture, for example `x86_64`.
        hostname:
          type:
          - string
          - 'null'
          description: Host name.
        kernelVersion:
          type:
          - string
          - 'null'
          description: Kernel version.
        name:
          type:
          - string
          - 'null'
          description: Name of the operating system, for example `Ubuntu`.
        version:
          type:
          - string
          - 'null'
          description: Version of the operating system.
    SystemPresetDto:
      type: object
      description: Reply of `POST /api/v1/system/preset`.
      required:
      - quality
      - speed
      - router
      properties:
        quality:
          type: integer
          format: int32
          description: Quality between 0 and 100.
          minimum: 0
        router:
          $ref: '#/components/schemas/RouterStatusDto'
          description: Router configuration of the preset.
        speed:
          type: integer
          format: int32
          description: Speed between 0 and 100. Always 100 - quality.
          minimum: 0
    SystemPresetRequestDto:
      type: object
      description: Body of `POST /api/v1/system/preset`.
      required:
      - quality
      properties:
        quality:
          type: integer
          format: int32
          description: Quality between 0 and 100. 0 is fastest, 100 is best.
          minimum: 0
    SystemProfileDto:
      type: object
      description: Full system profile of the host.
      required:
      - os
      - cpu
      - memory
      - disks
      - devices
      - resolver
      - recommendation
      - presets
      properties:
        cpu:
          $ref: '#/components/schemas/SystemCpuDto'
          description: Processor.
        devices:
          $ref: '#/components/schemas/SystemDevicesDto'
          description: Devices the daemon can use.
        disks:
          type: array
          items:
            $ref: '#/components/schemas/SystemDiskDto'
          description: Disks.
        memory:
          $ref: '#/components/schemas/SystemMemoryDto'
          description: Memory.
        os:
          $ref: '#/components/schemas/SystemOsDto'
          description: Operating system.
        presets:
          type: array
          items:
            $ref: '#/components/schemas/RouterPresetDto'
          description: Every preset from fastest to best, with the recommended one marked.
        recommendation:
          $ref: '#/components/schemas/SystemRecommendationDto'
          description: Recommended preset for this host.
        resolver:
          $ref: '#/components/schemas/SystemResolverDto'
          description: Resolver state.
    SystemRecommendationDto:
      type: object
      description: Recommendation for this host.
      required:
      - quality
      - speed
      - reason
      - factors
      - router
      properties:
        factors:
          type: array
          items:
            type: string
          description: Factors that shaped the recommendation.
        quality:
          type: integer
          format: int32
          description: Recommended quality between 0 and 100.
          minimum: 0
        reason:
          type: string
          description: Why this recommendation fits the host.
        router:
          $ref: '#/components/schemas/RouterStatusDto'
          description: Router configuration of the recommended preset.
        speed:
          type: integer
          format: int32
          description: Recommended speed between 0 and 100. Always 100 - quality.
          minimum: 0
    SystemResolverDto:
      type: object
      description: Resolver state of the host.
      required:
      - llamaReachable
      - embeddingsReachable
      - glinerInstalled
      - localEmbeddingInstalled
      - localRerankerInstalled
      - intentCount
      - labelCount
      properties:
        embeddingsDetail:
          type:
          - string
          - 'null'
          description: Why the embedding server does not answer, or null.
        embeddingsReachable:
          type: boolean
          description: Whether the embedding server answers.
        glinerInstalled:
          type: boolean
          description: Whether the selected GLiNER model is on disk.
        intentCount:
          type: integer
          description: Number of configured intents.
          minimum: 0
        labelCount:
          type: integer
          description: Number of labels a GLiNER model reads for this configuration.
          minimum: 0
        llamaDetail:
          type:
          - string
          - 'null'
          description: Why the llama server does not answer, or null.
        llamaReachable:
          type: boolean
          description: Whether the llama.cpp server answers.
        localEmbeddingInstalled:
          type: boolean
          description: Whether the selected embedding model is on disk.
        localRerankerInstalled:
          type: boolean
          description: Whether the selected reranker is on disk.
